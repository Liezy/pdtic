<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema PDTIC{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-8 w-full">
                    <a href="{% url 'home' %}" class="text-xl font-bold text-gray-900 flex-shrink-0">Sistema PDTIC</a>
                    <div class="flex items-center space-x-6 ml-8">
                        <a href="{% url 'instituicao_list' %}" class="border-transparent text-gray-600 hover:text-primary-700 hover:border-primary-500 whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm transition-all duration-150">
                            Instituições
                        </a>
                        <a href="{% url 'unidade_list' %}" class="border-transparent text-gray-600 hover:text-primary-700 hover:border-primary-500 whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm transition-all duration-150">
                            Unidades
                        </a>
                        <a href="{% url 'pdtic_list' %}" class="border-transparent text-gray-600 hover:text-primary-700 hover:border-primary-500 whitespace-nowrap py-2 px-3 border-b-2 font-medium text-sm transition-all duration-150">
                            PDTICs
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 rounded-md bg-green-50 p-4">
                    <div class="flex">
                        <div class="ml-3">
                            <p class="text-sm font-medium text-green-800">
                                {{ message }}
                            </p>
                        </div>
                    </div>
                </div>
            {% endfor %}
        {% endif %}

        <div class="px-4 py-6 sm:px-0">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden" style="z-index: 50;">
        <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-2xl shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="modal-title" class="text-lg font-medium text-gray-900"></h3>
                    <button id="close-modal" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div id="modal-content" class="text-sm text-gray-500">
                    <!-- Conteúdo do modal será inserido aqui -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sistema de Modal
        const modal = {
            container: document.getElementById('modal-container'),
            title: document.getElementById('modal-title'),
            content: document.getElementById('modal-content'),
            closeBtn: document.getElementById('close-modal'),

            open: function(title, content) {
                this.title.textContent = title;
                this.content.innerHTML = content;
                this.container.classList.remove('hidden');
                document.body.classList.add('overflow-hidden');
            },

            close: function() {
                this.container.classList.add('hidden');
                document.body.classList.remove('overflow-hidden');
                this.content.innerHTML = '';
            },

            loadForm: function(url, title) {
                fetch(url, {
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                    }
                })
                    .then(response => response.text())
                    .then(html => {
                        // Extrair apenas o formulário do HTML retornado
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const form = doc.querySelector('form');
                        if (form) {
                            this.open(title, form.outerHTML);
                            this.setupFormSubmission(url);
                        }
                    })
                    .catch(error => {
                        console.error('Erro ao carregar formulário:', error);
                        alert('Erro ao carregar formulário');
                    });
            },

            setupFormSubmission: function(actionUrl) {
                const form = this.content.querySelector('form');
                if (form) {
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        
                        const formData = new FormData(form);
                        const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]').value;
                        
                        fetch(actionUrl, {
                            method: 'POST',
                            body: formData,
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest',
                                'X-CSRFToken': csrfToken,
                            }
                        })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`HTTP error! status: ${response.status}`);
                            }
                            const contentType = response.headers.get("content-type");
                            if (contentType && contentType.indexOf("application/json") !== -1) {
                                return response.json();
                            } else {
                                return response.text().then(text => {
                                    throw new Error(`Expected JSON but got: ${text.slice(0, 100)}`);
                                });
                            }
                        })
                        .then(data => {
                            if (data.success) {
                                this.close();
                                // Recarregar a página para mostrar as mudanças
                                window.location.reload();
                            } else if (data.errors) {
                                // Mostrar erros no formulário
                                this.displayFormErrors(data.errors);
                            } else if (data.form_html) {
                                // Recarregar o formulário com erros
                                this.content.innerHTML = data.form_html;
                                this.setupFormSubmission(actionUrl);
                            }
                        })
                        .catch(error => {
                            console.error('Erro ao submeter formulário:', error);
                            alert('Erro ao salvar dados: ' + error.message);
                        });
                    });
                }
            },

            displayFormErrors: function(errors) {
                const form = this.content.querySelector('form');
                // Limpar erros anteriores
                form.querySelectorAll('.error-message').forEach(el => el.remove());
                
                // Adicionar novos erros
                for (const [field, messages] of Object.entries(errors)) {
                    const fieldElement = form.querySelector(`[name="${field}"]`);
                    if (fieldElement) {
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'error-message mt-2 text-sm text-red-600';
                        errorDiv.textContent = messages[0];
                        fieldElement.parentNode.appendChild(errorDiv);
                    }
                }
            }
        };

        // Event listeners
        modal.closeBtn.addEventListener('click', () => modal.close());
        modal.container.addEventListener('click', (e) => {
            if (e.target === modal.container) {
                modal.close();
            }
        });

        // Event listeners para botões que abrem modals
        document.addEventListener('click', (e) => {
            if (e.target.matches('[data-modal-form]')) {
                e.preventDefault();
                const url = e.target.href || e.target.dataset.url;
                const title = e.target.dataset.title || e.target.textContent.trim();
                modal.loadForm(url, title);
            }
        });

        // Fechar modal com ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.container.classList.contains('hidden')) {
                modal.close();
            }
        });
    </script>
</body>
</html>
