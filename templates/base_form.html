{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
        <div class="flex-1 min-w-0">
            <h2 class="text-xl sm:text-2xl lg:text-3xl font-bold leading-7 text-gray-900 break-words">
                {% block form_title %}{% endblock %}
            </h2>
        </div>
        <div class="flex sm:ml-4">
            <a href="{% block back_url %}{% endblock %}" 
               class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                <svg class="-ml-1 mr-2 h-4 w-4 sm:h-5 sm:w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Voltar
            </a>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg overflow-hidden">
        {% block form_content %}
        {% endblock %}
    </div>
</div>
{% endblock %}
